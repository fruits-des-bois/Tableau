<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Beauvais</title>
    
    <!-- Bibliothèques nécessaires pour le graphique de pluie et la carte -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --title-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1400px;
            width: 100%;
        }

        h1 {
            color: var(--title-color);
            font-size: 26px;
            margin-bottom: 5px;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 5px;
        }

        /* Grilles du dashboard */
        .grid-top, .grid-split {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .grid-bottom {
            width: 100%;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background-color: #f8fafc;
            padding: 12px 16px;
            font-weight: bold;
            color: var(--title-color);
            border-bottom: 1px solid var(--border-color);
        }

        iframe {
            width: 100%;
            border: none;
            background: white;
        }

        /* Hauteurs des composants */
        .iframe-top {
            height: 320px;
        }

        .iframe-bottom {
            height: 550px;
        }

        /* Conteneurs pour le graphique de pluie et la carte en JS natif */
        .chart-container, .map-container {
            width: 100%;
            height: 400px;
            padding: 15px;
            box-sizing: border-box;
        }

        #map {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .grid-top, .grid-split {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1> Dashboard Beauvais</h1>

    <!-- Partie Haute : Métriques et Débits côte à côte -->
    <div class="grid-top">
        <div class="card">
            <iframe class="iframe-top" src="https://pomme-joyeuse.github.io/atmosphere/Météo/HH_Morsang.html"></iframe>
        </div>

        <div class="card">
            <iframe class="iframe-top" src="https://pomme-joyeuse.github.io/atmosphere/Météo/debit_Morsang.html"></iframe>
        </div>
    </div>
        <!-- Partie Haute : Métriques et Débits côte à côte -->
    <div class="grid-top">
        <div class="card">
            <iframe class="iframe-top" src="https://fruits-des-bois.github.io/Tableau/hauteur_d_eau.html"></iframe>
        </div>

        <div class="card">
            <iframe class="iframe-top" src="https://fruits-des-bois.github.io/Tableau/debit_d_eau.html"></iframe>
        </div>
    </div>
        <!-- Partie Haute : Métriques et Débits côte à côte -->
    <div class="grid-top">
        <div class="card">
            <iframe class="iframe-top" src="https://fruits-des-bois.github.io/Tableau/hauteur_d_eau_avon.html"></iframe>
        </div>

        <div class="card">
            <iframe class="iframe-top" src="https://fruits-des-bois.github.io/Tableau/debit_d_eau_avon.html"></iframe>
        </div>
    </div>


</body>
</html>
